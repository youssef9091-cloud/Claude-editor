<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Hand;font-weight:700;src:url(../node_modules/@fontsource/aref-ruqaa/files/aref-ruqaa-arabic-700-normal.woff2)}
@font-face{font-family:Hand;font-weight:700;src:url(../node_modules/@fontsource/aref-ruqaa/files/aref-ruqaa-latin-700-normal.woff2);unicode-range:U+0000-00FF,U+2080-208F}
@font-face{font-family:Cap;font-weight:700;src:url(../node_modules/@fontsource/cairo/files/cairo-arabic-700-normal.woff2)}
@font-face{font-family:Cap;font-weight:700;src:url(../node_modules/@fontsource/cairo/files/cairo-latin-700-normal.woff2);unicode-range:U+0000-00FF,U+2080-208F}
@font-face{font-family:Kufi;font-weight:700;src:url(../node_modules/@fontsource/reem-kufi/files/reem-kufi-arabic-700-normal.woff2)}
html,body{margin:0;background:#000}
</style></head><body>
<canvas id="c"></canvas>
<script src="../node_modules/d3-array/dist/d3-array.min.js"></script>
<script src="../node_modules/d3-geo/dist/d3-geo.min.js"></script>
<script src="../node_modules/topojson-client/dist/topojson-client.min.js"></script>
<script src="util.js"></script>
<script>window.TIMING = null;</script>
<script>
(async () => {
  window.TIMING = await (await fetch('../timing.json')).json();
  for (const s of ['../score.js', '../film.js']) await new Promise((ok, no) => {
    const e = document.createElement('script'); e.src = s; e.onload = ok; e.onerror = no; document.body.appendChild(e); });
  const q = new URLSearchParams(location.search), scale = +(q.get('scale') || 1);
  const c = document.getElementById('c'); c.width = SCORE.W * scale; c.height = SCORE.H * scale;
  const ctx = c.getContext('2d');
  await Promise.all(['700 40px Hand', '700 40px Cap', '700 40px Kufi'].map(f => document.fonts.load(f, 'ابجد ١٢٣ CO₂')));
  await FILM.load();
  window.renderFrame = (t) => { ctx.setTransform(scale, 0, 0, scale, 0, 0); FILM.draw(ctx, t); };
  window.grab = (q = 0.94) => c.toDataURL('image/jpeg', q);
  window.READY = true;
})().catch(e => { window.ERR = String(e.stack || e); });
</script></body></html>
